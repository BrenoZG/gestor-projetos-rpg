name: CI

on:
  pull_request:
  push:
    branches: [main]

# Menor privilégio: o pipeline só lê o código.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Actions fixadas por SHA de commit (tag é mutável e pode ser sequestrada).
# O comentário indica a versão; o Dependabot atualiza os dois.
jobs:
  qualidade:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build
      - run: npm audit --audit-level=high --omit=dev

  # CLI do gitleaks chamada diretamente, em vez da gitleaks-action: a action monta
  # o intervalo `<primeiro>^..<último>` e quebra quando o primeiro commit não tem
  # pai, além de baixar uma versão do gitleaks escolhida por ela. Aqui a versão é
  # fixada, o binário é conferido por checksum e o histórico inteiro é varrido.
  # O Dependabot não atualiza esta versão: revisar a cada release do gitleaks.
  segredos:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSAO: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      # Histórico completo: o gitleaks varre todos os commits, não só o último.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Instalar gitleaks (versão fixada, checksum conferido)
        run: |
          arquivo="gitleaks_${GITLEAKS_VERSAO}_linux_x64.tar.gz"
          curl -sSfL -o "$arquivo" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSAO}/${arquivo}"
          echo "${GITLEAKS_SHA256}  ${arquivo}" | sha256sum --check --strict
          tar -xzf "$arquivo" gitleaks
      - name: Varrer o histórico completo
        run: ./gitleaks git . --redact --no-banner --exit-code 1
