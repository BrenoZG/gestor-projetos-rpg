name: CI

# Na main, o CI roda como primeira etapa do Deploy (workflow_call), que só
# publica se ele passar; não há um segundo disparo por push.
on:
  pull_request:
  workflow_call:

# Menor privilégio: o pipeline só lê o código.
permissions:
  contents: read

# Num PR, um push novo cancela o CI antigo. Chamado pelo Deploy, nunca cancela.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Actions fixadas por SHA de commit (tag é mutável e pode ser sequestrada).
# O comentário indica a versão; o Dependabot atualiza os dois.
jobs:
  qualidade:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build
      - run: npm audit --audit-level=high --omit=dev

  # Banco descartável do zero a cada execução: prova que as migrations aplicam
  # num banco vazio, roda os testes pgTAP (RLS, GRANT, funções) e os advisors.
  # A CLI vem do `npm ci`, na versão travada pelo lockfile, igual à local.
  # Sobem só o banco e o Auth (que aplica as próprias migrations no schema
  # `auth`, referenciado pelas FKs, deixando-o igual ao da produção); o resto
  # da stack não é usado aqui e só atrasaria o job.
  # As variáveis do OAuth do GitHub ficam vazias: nenhum login acontece aqui.
  # As chaves que o `supabase start` imprime são as de demonstração, públicas
  # e iguais em toda instalação local; não são segredos.
  banco:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Imagens Docker do Supabase guardadas entre execuções: o download levava
      # ~90 s dos ~105 s de subida (medido no run 41142118857). A chave muda com
      # a versão da CLI (lockfile) e com o config.toml: nunca usa imagem velha.
      # Cada job guarda o próprio conjunto, porque os dois sobem serviços diferentes.
      - name: Restaurar as imagens do Supabase
        id: imagens
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /tmp/imagens-supabase.tar
          key: imagens-supabase-banco-${{ runner.os }}-${{ hashFiles('package-lock.json', 'supabase/config.toml') }}
      - if: steps.imagens.outputs.cache-hit == 'true'
        run: docker load -i /tmp/imagens-supabase.tar
      - name: Subir o banco e aplicar as migrations
        run: npx supabase start -x realtime,storage-api,imgproxy,kong,mailpit,postgrest,postgres-meta,studio,edge-runtime,logflare,vector,supavisor
      - name: Preparar as imagens do Supabase para o cache
        if: steps.imagens.outputs.cache-hit != 'true'
        run: docker save $(docker images --format '{{.Repository}}:{{.Tag}}' | grep 'supabase/') -o /tmp/imagens-supabase.tar
      - run: npm run db:test
      - run: npm run db:advisors

  # E2E (Playwright + axe) contra o build de produção e um Supabase local
  # descartável. Além do banco e do Auth, sobem a API (PostgREST) e o gateway
  # (Kong), que o app usa. O usuário de teste e a sessão vêm da API admin LOCAL
  # (chaves de demonstração); o setup se recusa a rodar contra outro endereço.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Mesmo cache de imagens do job banco (ver o comentário lá), com chave própria.
      - name: Restaurar as imagens do Supabase
        id: imagens
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /tmp/imagens-supabase.tar
          key: imagens-supabase-e2e-${{ runner.os }}-${{ hashFiles('package-lock.json', 'supabase/config.toml') }}
      - if: steps.imagens.outputs.cache-hit == 'true'
        run: docker load -i /tmp/imagens-supabase.tar
      - name: Subir o Supabase local (banco, Auth, API e gateway)
        run: npx supabase start -x realtime,storage-api,imgproxy,mailpit,postgres-meta,studio,edge-runtime,logflare,vector,supavisor
      - name: Preparar as imagens do Supabase para o cache
        if: steps.imagens.outputs.cache-hit != 'true'
        run: docker save $(docker images --format '{{.Repository}}:{{.Tag}}' | grep 'supabase/') -o /tmp/imagens-supabase.tar
      - name: Apontar o app para o Supabase local
        run: |
          npx supabase status -o json | node -e "
            const s = JSON.parse(require('fs').readFileSync(0, 'utf8'));
            require('fs').appendFileSync(process.env.GITHUB_ENV, [
              'NEXT_PUBLIC_SUPABASE_URL=' + s.API_URL,
              'NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=' + s.PUBLISHABLE_KEY,
              'ALLOWLIST_GITHUB_IDS=1',
              '',
            ].join('\n'));"
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      # Relatório e traces só quando algo falha, para investigar sem reproduzir.
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: relatorio-e2e
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  # CLI do gitleaks chamada diretamente, em vez da gitleaks-action: a action monta
  # o intervalo `<primeiro>^..<último>` e quebra quando o primeiro commit não tem
  # pai, além de baixar uma versão do gitleaks escolhida por ela. Aqui a versão é
  # fixada, o binário é conferido por checksum e o histórico inteiro é varrido.
  # O Dependabot não atualiza esta versão: revisar a cada release do gitleaks.
  segredos:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSAO: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      # Histórico completo: o gitleaks varre todos os commits, não só o último.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Instalar gitleaks (versão fixada, checksum conferido)
        run: |
          arquivo="gitleaks_${GITLEAKS_VERSAO}_linux_x64.tar.gz"
          curl -sSfL -o "$arquivo" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSAO}/${arquivo}"
          echo "${GITLEAKS_SHA256}  ${arquivo}" | sha256sum --check --strict
          tar -xzf "$arquivo" gitleaks
      - name: Varrer o histórico completo
        run: ./gitleaks git . --redact --no-banner --exit-code 1
